[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# One link, always: https://culture-barbershop.netlify.app/ (Netlify forces HTTPS).
# Unknown paths (typos, old links) show 404.html, which sends visitors to the homepage.
# No catch-all redirect, so /.netlify/functions/* (booking + Twilio webhooks) are never intercepted.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/og-card.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
